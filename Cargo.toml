[package]
name = "linkman"
version = "0.1.0"
edition = "2024"
description = "A fast, beautiful TUI + CLI for creating and managing symlinks"
license = "MIT"
keywords = ["symlink", "cli", "tui", "files"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = "4"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
