name: Release

# Phase 1 (quality gate): fmt → clippy → tests.
# Phase 2 (tag pushed, e.g. v0.2.0): build every platform, attach the
# packages to a GitHub Release, then update the AUR package.

on:
  push:
    tags:
      - "v*"
  # Re-run the whole pipeline for an existing tag, e.g. once the AUR package has
  # been created by hand:  gh workflow run release.yml --ref v0.1.0
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt,clippy
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  completions:
    name: shell completions
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-completions-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-completions-${{ runner.os }}-

      - name: Build the host binary
        run: cargo build --release --locked

      # Completions only depend on the CLI definition, so they are generated
      # once on the host and shared — cross-built binaries cannot be executed
      # on the runner that produced them.
      - name: Generate completions
        run: |
          mkdir -p completions
          ./target/release/linkman completions bash > completions/linkman.bash
          ./target/release/linkman completions zsh > completions/_linkman
          ./target/release/linkman completions fish > completions/linkman.fish
          ls -l completions

      - uses: actions/upload-artifact@v4
        with:
          name: completions
          path: completions/*
          if-no-files-found: error

  build:
    name: build (${{ matrix.target }})
    needs: [check, completions]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            deb: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup target add "${{ matrix.target }}"
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-build-${{ matrix.target }}-

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install the aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Fetch the shared shell completions
        uses: actions/download-artifact@v4
        with:
          name: completions
          path: completions

      - name: Package
        run: bash packaging/package.sh "${{ matrix.target }}" dist
        env:
          LINKMAN_DEB: ${{ matrix.deb == true && '1' || '0' }}
          LINKMAN_COMPLETIONS_DIR: ${{ github.workspace }}/completions

      - uses: actions/upload-artifact@v4
        with:
          name: linkman-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish the GitHub release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # --verify-tag needs a git repository with the tag present locally.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: linkman-*

      - name: Checksums
        working-directory: dist
        run: |
          : > SHA256SUMS.txt
          for file in *.tar.gz *.deb; do
            if [ -e "$file" ]; then
              sha256sum "$file" >> SHA256SUMS.txt
            fi
          done
          cat SHA256SUMS.txt

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "linkman ${version}" \
              --generate-notes \
              dist/*
          fi
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'

  aur:
    name: publish to the AUR
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm git openssh curl jq
          useradd -m builder

      - uses: actions/checkout@v4

      # AUR packages can only be created by hand (aurweb has no API for it), so a
      # missing package is a one-time setup step, not a build failure: publish to
      # whichever packages exist and explain the rest without going red.
      - name: Work out which AUR packages exist
        run: |
          info="$(curl -fsSL 'https://aur.archlinux.org/rpc/v5/info?arg[]=linkman&arg[]=linkman-bin')"
          present=()
          for pkg in linkman linkman-bin; do
            if printf '%s' "$info" | jq -e --arg p "$pkg" 'any(.results[]; .Name == $p)' >/dev/null; then
              present+=("$pkg")
              echo "${pkg} is on the AUR"
            else
              echo "::warning::AUR package '${pkg}' does not exist yet — create it once at https://aur.archlinux.org/packages/${pkg}/ and the next release publishes to it."
            fi
          done
          echo "AUR_PACKAGES=${present[*]}" >> "$GITHUB_ENV"
          echo "Found: ${present[*]:-(none)}"
          if [ "${#present[@]}" -eq 0 ]; then
            echo "AUR_PUBLISH=0" >> "$GITHUB_ENV"
            {
              echo "## AUR: nothing published yet"
              echo
              echo "Neither \`linkman\` nor \`linkman-bin\` exists on the AUR, so there is nothing to push to."
              echo "Both install the same prebuilt release and conflict with each other, so one is enough."
              echo "Submit either empty package once, then re-run this job:"
              echo
              echo "- https://aur.archlinux.org/packages/linkman/"
              echo "- https://aur.archlinux.org/packages/linkman-bin/"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "AUR_PUBLISH=1" >> "$GITHUB_ENV"
          fi

      - name: No AUR package exists yet
        if: env.AUR_PUBLISH != '1'
        run: |
          echo "Skipping the AUR — create the package once on the website, then re-run this job."

      - name: Download the released tarball and hash it
        if: env.AUR_PUBLISH == '1'
        run: |
          version="${GITHUB_REF_NAME#v}"
          curl -fsSL -o /tmp/linkman.tar.gz \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/linkman-${version}-x86_64-unknown-linux-gnu.tar.gz"
          echo "PKG_SHA256=$(sha256sum /tmp/linkman.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Render the PKGBUILDs
        if: env.AUR_PUBLISH == '1'
        run: |
          version="${GITHUB_REF_NAME#v}"
          for pkg in $AUR_PACKAGES; do
            work="$RUNNER_TEMP/aur-${pkg}"
            mkdir -p "$work"
            sed -e "s|@VERSION@|${version}|g" \
                -e "s|@SHA256@|${PKG_SHA256}|g" \
                -e "s|@REPO@|${GITHUB_REPOSITORY}|g" \
                "packaging/aur/${pkg}/PKGBUILD" > "$work/PKGBUILD"
            chown -R builder:builder "$work"
            su -s /bin/bash builder -c "cd '$work' && makepkg --printsrcinfo > .SRCINFO"
            echo "=== ${pkg}"
            cat "$work/PKGBUILD" "$work/.SRCINFO"
          done

      - name: Push to the AUR
        if: env.AUR_PUBLISH == '1'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY is not set"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%b\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          for pkg in $AUR_PACKAGES; do
            work="$RUNNER_TEMP/aur-${pkg}"
            repo="/tmp/aur-${pkg}"
            git clone "ssh://aur@aur.archlinux.org/${pkg}.git" "$repo"
            cp "$work/PKGBUILD" "$work/.SRCINFO" "$repo/"
            cd "$repo"
            git config user.name "linkman CI"
            git config user.email "zaidejjo@users.noreply.github.com"
            git add PKGBUILD .SRCINFO
            if git diff --cached --quiet; then
              echo "${pkg} is already up to date for ${version}"
            else
              git commit -m "${pkg} ${version}"
              git push origin HEAD:master
              echo "pushed ${pkg} ${version}"
            fi
            cd -
          done

      # The AUR index updates a little after the push, so poll before believing it.
      - name: Verify the AUR serves the new version
        if: env.AUR_PUBLISH == '1'
        run: |
          version="${GITHUB_REF_NAME#v}-1"
          failures=0
          for pkg in $AUR_PACKAGES; do
            got=""
            for attempt in $(seq 1 12); do
              got="$(curl -fsSL "https://aur.archlinux.org/rpc/v5/info?arg[]=${pkg}" \
                | jq -r --arg p "$pkg" '.results[] | select(.Name == $p) | .Version' || true)"
              if [ "$got" = "$version" ]; then
                echo "${pkg} is published at ${got}"
                break
              fi
              sleep 5
            done
            if [ "$got" != "$version" ]; then
              echo "::error::${pkg} reports '${got:-nothing}' on the AUR, expected '${version}'"
              failures=$((failures + 1))
            fi
          done
          [ "$failures" -eq 0 ]
