name: Release

# Phase 1 (quality gate): fmt → clippy → tests.
# Phase 2 (tag pushed, e.g. v0.2.0): build every platform, attach the
# packages to a GitHub Release, then update the AUR package.

on:
  push:
    tags:
      - "v*"
  # Re-run the whole pipeline for an existing tag, e.g. once the AUR package has
  # been created by hand:  gh workflow run release.yml --ref v0.1.0
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt,clippy
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  completions:
    name: shell completions
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-completions-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-completions-${{ runner.os }}-

      - name: Build the host binary
        run: cargo build --release --locked

      # Completions only depend on the CLI definition, so they are generated
      # once on the host and shared — cross-built binaries cannot be executed
      # on the runner that produced them.
      - name: Generate completions
        run: |
          mkdir -p completions
          ./target/release/linkman completions bash > completions/linkman.bash
          ./target/release/linkman completions zsh > completions/_linkman
          ./target/release/linkman completions fish > completions/linkman.fish
          ls -l completions

      - uses: actions/upload-artifact@v4
        with:
          name: completions
          path: completions/*
          if-no-files-found: error

  build:
    name: build (${{ matrix.target }})
    needs: [check, completions]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            deb: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup target add "${{ matrix.target }}"
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-build-${{ matrix.target }}-

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install the aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Fetch the shared shell completions
        uses: actions/download-artifact@v4
        with:
          name: completions
          path: completions

      - name: Package
        run: bash packaging/package.sh "${{ matrix.target }}" dist
        env:
          LINKMAN_DEB: ${{ matrix.deb == true && '1' || '0' }}
          LINKMAN_COMPLETIONS_DIR: ${{ github.workspace }}/completions

      - uses: actions/upload-artifact@v4
        with:
          name: linkman-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish the GitHub release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # --verify-tag needs a git repository with the tag present locally.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: linkman-*

      - name: Checksums
        working-directory: dist
        run: |
          : > SHA256SUMS.txt
          for file in *.tar.gz *.deb; do
            if [ -e "$file" ]; then
              sha256sum "$file" >> SHA256SUMS.txt
            fi
          done
          cat SHA256SUMS.txt

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "linkman ${version}" \
              --generate-notes \
              dist/*
          fi
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'

  aur:
    name: publish to the AUR
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm git openssh curl jq
          useradd -m builder

      - uses: actions/checkout@v4

      # A push creates the package: aurweb's update hook calls create_pkgbase()
      # when the pushed pkgbase has no row yet (see aurweb/git/update.py), and
      # serve.py only checks ownership for pkgbases that already exist. So there
      # is no "submit it on the website first" step — pushing PKGBUILD +
      # .SRCINFO is the whole submission, and updating later is the same push.
      #
      # The catch is the account, not the code: the key in AUR_SSH_PRIVATE_KEY
      # must be registered on the AUR account, and that account's email must be
      # verified — aurweb refuses every mutating action otherwise.
      #
      # `linkman` builds from the release tag's source (the AUR requires a
      # non -bin name to build from source); `linkman-bin` installs the prebuilt
      # tarball. Both install the same program and conflict with each other.
      - name: Render the PKGBUILDs
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}"
          curl -fsSL -o /tmp/source.tar.gz \
            "${base}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          curl -fsSL -o /tmp/binary.tar.gz \
            "${base}/releases/download/${GITHUB_REF_NAME}/linkman-${version}-x86_64-unknown-linux-gnu.tar.gz"
          source_sha="$(sha256sum /tmp/source.tar.gz | cut -d' ' -f1)"
          binary_sha="$(sha256sum /tmp/binary.tar.gz | cut -d' ' -f1)"
          echo "source sha256: ${source_sha}"
          echo "binary sha256: ${binary_sha}"
          for pkg in linkman linkman-bin; do
            work="$RUNNER_TEMP/aur-${pkg}"
            mkdir -p "$work"
            sed -e "s|@VERSION@|${version}|g" \
                -e "s|@SOURCE_SHA256@|${source_sha}|g" \
                -e "s|@BINARY_SHA256@|${binary_sha}|g" \
                -e "s|@REPO@|${GITHUB_REPOSITORY}|g" \
                "packaging/aur/${pkg}/PKGBUILD" > "$work/PKGBUILD"
            echo "=== ${pkg}"
            cat "$work/PKGBUILD"
          done

      - name: Generate .SRCINFO
        run: |
          for pkg in linkman linkman-bin; do
            work="$RUNNER_TEMP/aur-${pkg}"
            chown -R builder:builder "$work"
            su -s /bin/bash builder -c "cd '$work' && makepkg --printsrcinfo > .SRCINFO"
            echo "=== ${pkg}/.SRCINFO"
            cat "$work/.SRCINFO"
          done

      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY is not set, so there is no way to authenticate to the AUR."
            exit 1
          fi
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%b\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          # A container job runs `run:` blocks under `sh -e`, so ssh cannot stop to
          # ask about an unknown host key, and the image ships no known_hosts.
          # Pin the key and accept the host key on first use instead of relying on
          # `ssh-keyscan`, which produced nothing git's ssh would accept here.
          ssh_opts="-i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes"
          ssh_opts="$ssh_opts -o StrictHostKeyChecking=accept-new"
          ssh_opts="$ssh_opts -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh $ssh_opts"

          # Say out loud whether the key is registered before anything else runs:
          # aurweb greets a known key and refuses an unknown one, so this turns a
          # cryptic "Could not read from remote repository" into a real answer.
          echo "--- what the AUR says about this key:"
          ssh $ssh_opts -T aur@aur.archlinux.org 2>&1 | sed 's/^/    /' || true

          for pkg in linkman linkman-bin; do
            work="$RUNNER_TEMP/aur-${pkg}"
            repo="/tmp/aur-${pkg}"
            rm -rf "$repo"
            # An empty clone is the normal case for a name that does not exist
            # yet — the push below creates it.
            git clone "ssh://aur@aur.archlinux.org/${pkg}" "$repo" || {
              echo "::error::Could not authenticate to the AUR as ${pkg}. The greeting above says why: 'Welcome to AUR' means the key works, 'Permission denied (publickey)' means the public half is not on your AUR account, and a 'not verified' message means the account's email is unconfirmed."
              exit 1
            }
            cp "$work/PKGBUILD" "$work/.SRCINFO" "$repo/"
            cd "$repo"
            git config user.name "linkman CI"
            git config user.email "zaidejjo@users.noreply.github.com"
            git checkout -q -B master
            git add PKGBUILD .SRCINFO
            if git diff --cached --quiet; then
              echo "${pkg} is already up to date for ${version}"
            else
              git commit -m "${pkg} ${version}"
              git push origin HEAD:master
              echo "pushed ${pkg} ${version}"
            fi
            cd -
          done

      # The AUR index updates a little after the push, so poll before believing it.
      - name: Verify the AUR serves the new version
        run: |
          version="${GITHUB_REF_NAME#v}-1"
          failures=0
          for pkg in linkman linkman-bin; do
            got=""
            for attempt in $(seq 1 12); do
              got="$(curl -fsSL "https://aur.archlinux.org/rpc/v5/info?arg[]=${pkg}" \
                | jq -r --arg p "$pkg" '.results[] | select(.Name == $p) | .Version' || true)"
              if [ "$got" = "$version" ]; then
                echo "${pkg} is published at ${got}"
                break
              fi
              sleep 5
            done
            if [ "$got" != "$version" ]; then
              echo "::error::${pkg} reports '${got:-nothing}' on the AUR, expected '${version}'"
              failures=$((failures + 1))
            fi
          done
          [ "$failures" -eq 0 ]
